<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 780" width="1220" height="780" role="img" aria-labelledby="t d">
  <title id="t">Comment fonctionne le projet</title>
  <desc id="d">Quatre étapes : rassembler les documents, les étiqueter, rédiger des fiches, répondre aux militants sur Telegram. Tout est rangé dans une bibliothèque partagée, avec relecture humaine avant diffusion.</desc>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2a44; }
      .h1 { font-size: 30px; font-weight: 700; }
      .sub { font-size: 16px; fill: #475569; }
      .ct { font-size: 21px; font-weight: 700; }
      .num { font-size: 18px; font-weight: 700; fill: #ffffff; }
      .body { font-size: 15px; fill: #334155; }
      .chip { font-size: 13px; font-weight: 600; }
      .lib { font-size: 19px; font-weight: 700; }
      .small { font-size: 12px; fill: #64748b; font-style: italic; }
      .gt { font-size: 17px; font-weight: 700; }
      .g { font-size: 14px; fill: #334155; }
      .foot { font-size: 13px; fill: #64748b; }
      .ico { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1220" height="780" fill="#ffffff"/>

  <text class="h1" x="610" y="56" text-anchor="middle">Comment fonctionne le projet</text>
  <text class="sub" x="610" y="88" text-anchor="middle">Une bibliothèque vérifiée du programme « L'Avenir en commun », que les militants consultent sur Telegram</text>

  <!-- Flèches entre étapes -->
  <line x1="299" y1="280" x2="329" y2="280" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="594" y1="280" x2="624" y2="280" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>
  <line x1="889" y1="280" x2="919" y2="280" stroke="#94a3b8" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 1. Rassembler -->
  <g>
    <rect x="40" y="120" width="255" height="330" rx="16" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <circle cx="74" cy="158" r="18" fill="#0f766e"/>
    <text class="num" x="74" y="164" text-anchor="middle">1</text>
    <text class="ct" x="102" y="165">Rassembler</text>
    <circle cx="167" cy="225" r="32" fill="#ccfbf1"/>
    <g class="ico" stroke="#0f766e">
      <path d="M151 229 h8 l3 5 h10 l3 -5 h8 v12 h-32 z"/>
      <path d="M167 205 v18 M160 216 l7 7 l7 -7"/>
    </g>
    <text class="body" x="60" y="290">Les documents arrivent</text>
    <text class="body" x="60" y="311">de deux façons :</text>
    <text class="body" x="60" y="336">• automatiquement, depuis</text>
    <text class="body" x="72" y="357">le site officiel ;</text>
    <text class="body" x="60" y="382">• envoyés par l'équipe au</text>
    <text class="body" x="72" y="403">bot Telegram (PDF, lien…).</text>
    <rect x="60" y="418" width="96" height="22" rx="11" fill="#e2e8f0"/>
    <text class="chip" x="108" y="433" text-anchor="middle" fill="#334155">Automatique</text>
    <rect x="164" y="418" width="62" height="22" rx="11" fill="#dcfce7"/>
    <text class="chip" x="195" y="433" text-anchor="middle" fill="#166534">Équipe</text>
  </g>

  <!-- 2. Étiqueter -->
  <g>
    <rect x="335" y="120" width="255" height="330" rx="16" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
    <circle cx="369" cy="158" r="18" fill="#b45309"/>
    <text class="num" x="369" y="164" text-anchor="middle">2</text>
    <text class="ct" x="397" y="165">Étiqueter</text>
    <circle cx="462" cy="225" r="32" fill="#fef3c7"/>
    <g class="ico" stroke="#b45309">
      <path d="M446 209 h15 l17 17 l-15 15 l-17 -17 z"/>
      <circle cx="453" cy="216" r="2.5"/>
    </g>
    <text class="body" x="355" y="290">Chaque document reçoit des</text>
    <text class="body" x="355" y="311">étiquettes : thème, type,</text>
    <text class="body" x="355" y="332">date, source, fiabilité…</text>
    <text class="body" x="355" y="361">L'IA propose, l'équipe</text>
    <text class="body" x="355" y="382">vérifie. La correction</text>
    <text class="body" x="355" y="403">humaine a le dernier mot.</text>
    <rect x="355" y="418" width="90" height="22" rx="11" fill="#ede9fe"/>
    <text class="chip" x="400" y="433" text-anchor="middle" fill="#5b21b6">IA propose</text>
    <rect x="453" y="418" width="112" height="22" rx="11" fill="#dcfce7"/>
    <text class="chip" x="509" y="433" text-anchor="middle" fill="#166534">Humain décide</text>
  </g>

  <!-- 3. Rédiger -->
  <g>
    <rect x="630" y="120" width="255" height="330" rx="16" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
    <circle cx="664" cy="158" r="18" fill="#6d28d9"/>
    <text class="num" x="664" y="164" text-anchor="middle">3</text>
    <text class="ct" x="692" y="165">Rédiger</text>
    <circle cx="757" cy="225" r="32" fill="#ede9fe"/>
    <g class="ico" stroke="#6d28d9">
      <rect x="742" y="207" width="24" height="32" rx="3"/>
      <path d="M748 217 h12 M748 224 h12 M748 231 h7"/>
      <path d="M774 214 l-12 22 l-1 6 l5 -4 l12 -22 z"/>
    </g>
    <text class="body" x="650" y="290">Avec l'IA, hors de l'outil,</text>
    <text class="body" x="650" y="311">l'équipe prépare des fiches,</text>
    <text class="body" x="650" y="332">argumentaires et réponses</text>
    <text class="body" x="650" y="353">aux objections à partir des</text>
    <text class="body" x="650" y="374">documents vérifiés, puis les</text>
    <text class="body" x="650" y="395">dépose pour relecture.</text>
    <rect x="650" y="418" width="84" height="22" rx="11" fill="#ede9fe"/>
    <text class="chip" x="692" y="433" text-anchor="middle" fill="#5b21b6">IA rédige</text>
    <rect x="742" y="418" width="112" height="22" rx="11" fill="#dcfce7"/>
    <text class="chip" x="798" y="433" text-anchor="middle" fill="#166534">Humain valide</text>
  </g>

  <!-- 4. Répondre -->
  <g>
    <rect x="925" y="120" width="255" height="330" rx="16" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <circle cx="959" cy="158" r="18" fill="#1d4ed8"/>
    <text class="num" x="959" y="164" text-anchor="middle">4</text>
    <text class="ct" x="987" y="165">Répondre</text>
    <circle cx="1052" cy="225" r="32" fill="#dbeafe"/>
    <g class="ico" stroke="#1d4ed8">
      <path d="M1040 211 h24 a6 6 0 0 1 6 6 v12 a6 6 0 0 1 -6 6 h-14 l-8 7 v-7 h-2 a6 6 0 0 1 -6 -6 v-12 a6 6 0 0 1 6 -6 z"/>
      <path d="M1045 223 h0.01 M1052 223 h0.01 M1059 223 h0.01" stroke-width="4"/>
    </g>
    <text class="body" x="945" y="290">Les militants posent leurs</text>
    <text class="body" x="945" y="311">questions au bot Telegram.</text>
    <text class="body" x="945" y="340">L'IA l'aide à choisir les</text>
    <text class="body" x="945" y="361">documents les plus utiles,</text>
    <text class="body" x="945" y="382">envoyés tels quels, avec</text>
    <text class="body" x="945" y="403">leur source.</text>
    <rect x="945" y="418" width="84" height="22" rx="11" fill="#dbeafe"/>
    <text class="chip" x="987" y="433" text-anchor="middle" fill="#1e40af">Militants</text>
  </g>

  <!-- Liens étapes <-> bibliothèque -->
  <g stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 5">
    <line x1="167" y1="454" x2="167" y2="484" marker-end="url(#arr)"/>
    <line x1="462" y1="458" x2="462" y2="484" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="757" y1="458" x2="757" y2="484" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <line x1="1052" y1="484" x2="1052" y2="456" marker-end="url(#arr)"/>
  </g>
  <text class="small" x="177" y="470">range</text>
  <text class="small" x="472" y="470">annote</text>
  <text class="small" x="767" y="470">puise et ajoute</text>
  <text class="small" x="1062" y="470">cherche</text>

  <!-- Bibliothèque -->
  <rect x="40" y="490" width="1140" height="86" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <g class="ico" stroke="#475569">
    <path d="M70 517 c10 -5 20 -5 28 1 v32 c-8 -6 -18 -6 -28 -1 z"/>
    <path d="M126 517 c-10 -5 -20 -5 -28 1 v32 c8 -6 18 -6 28 -1 z"/>
  </g>
  <text class="lib" x="146" y="526">La bibliothèque partagée</text>
  <text class="body" x="146" y="553">Tous les documents, leurs étiquettes et où ils en sont : reçu, vérifié, validé.</text>

  <!-- Garde-fous -->
  <text class="gt" x="40" y="620">Les garde-fous</text>
  <g>
    <rect x="40" y="634" width="366" height="80" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <circle cx="74" cy="674" r="16" fill="#16a34a"/>
    <path class="ico" d="M66 674 l6 6 l10 -12" stroke="#ffffff"/>
    <text class="g" x="102" y="668">Rien de ce qu'écrit l'IA n'arrive aux</text>
    <text class="g" x="102" y="689">militants sans relecture humaine.</text>
  </g>
  <g>
    <rect x="427" y="634" width="366" height="80" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <circle cx="461" cy="674" r="16" fill="#16a34a"/>
    <path class="ico" d="M453 674 l6 6 l10 -12" stroke="#ffffff"/>
    <text class="g" x="489" y="668">Chaque réponse cite sa source :</text>
    <text class="g" x="489" y="689">titre, lien et page du document.</text>
  </g>
  <g>
    <rect x="814" y="634" width="366" height="80" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <circle cx="848" cy="674" r="16" fill="#16a34a"/>
    <path class="ico" d="M840 674 l6 6 l10 -12" stroke="#ffffff"/>
    <text class="g" x="876" y="668">Hors site officiel, un document n'est</text>
    <text class="g" x="876" y="689">diffusé qu'après vérification humaine.</text>
  </g>

  <text class="foot" x="610" y="752" text-anchor="middle">Initiative personnelle, non officielle, non endossée par La France insoumise.</text>
</svg>
